name: Deploy production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/nexus-control' }}
  PHP_BIN: ${{ vars.PHP_BIN || 'php' }}

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: self-hosted
    environment: production
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Verify server tools
        shell: bash
        run: |
          set -euo pipefail
          "$PHP_BIN" -r 'exit(version_compare(PHP_VERSION, "8.3.0", ">=") ? 0 : 1);'
          composer --version
          node --version
          npm --version
          rsync --version | head -n 1

      - name: Install API production dependencies
        working-directory: server-manager-api
        shell: bash
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Build UI
        working-directory: server-manager-ui
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Deploy production
        shell: bash
        run: |
          set -euo pipefail
          umask 0002

          API_PATH="$DEPLOY_PATH/api"
          UI_PATH="$DEPLOY_PATH/ui-dist"

          mkdir -p "$API_PATH" "$UI_PATH"

          if [ ! -f "$API_PATH/.env" ]; then
            echo "Missing production environment file: $API_PATH/.env"
            echo "The pipeline will never create or overwrite production secrets."
            exit 1
          fi

          rsync -a --delete \
            --exclude='.env' \
            --exclude='storage' \
            server-manager-api/ "$API_PATH/"
          rsync -a --delete server-manager-ui/dist/ "$UI_PATH/"

          chmod 640 "$API_PATH/.env"
          chmod -R ug+rwX "$API_PATH/storage" "$API_PATH/bootstrap/cache"

          cd "$API_PATH"
          "$PHP_BIN" artisan migrate --force --no-interaction
          "$PHP_BIN" artisan optimize:clear
          "$PHP_BIN" artisan config:cache
          "$PHP_BIN" artisan route:cache
          "$PHP_BIN" artisan event:cache
          "$PHP_BIN" artisan storage:link --force
          "$PHP_BIN" artisan queue:restart

          echo "Deployed release: $GITHUB_SHA"
