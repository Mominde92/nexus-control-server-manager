# ---------------------------------------------------------------------------
# Nginx vhost for the Server Manager API.
#
# Serves only /public and forwards PHP to the php-fpm container (`api:9000`).
# ---------------------------------------------------------------------------

# Rate limit zone for authentication endpoints — defence in depth alongside
# Laravel's own throttle middleware.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=300r/m;

upstream php_fpm {
    server api:9000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 10M;

    # --- Security headers ---------------------------------------------------
    # This vhost serves a JSON API, so the CSP can be maximally restrictive.
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "DENY" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection         "0" always;
    add_header Content-Security-Policy  "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    # Enable once TLS is terminated here rather than upstream:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server_tokens off;

    # --- Logging -----------------------------------------------------------
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # --- Compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain application/xml;

    # --- Routing -----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Tighter limits on credential-guessing surfaces.
    location ~ ^/api/auth/(login|forgot-password|reset-password)$ {
        limit_req zone=auth_zone burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Health endpoint stays unlogged to keep noise down.
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php_fpm;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param HTTPS           $http_x_forwarded_proto if_not_empty;

        fastcgi_hide_header X-Powered-By;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
        fastcgi_connect_timeout 5s;
    }

    # Never expose FPM internals publicly.
    location ~ ^/(fpm-status|fpm-ping)$ {
        deny all;
    }

    # Block dotfiles (.env, .git) outright — they should not be under /public,
    # but defence in depth costs nothing.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Any other .php file must not be executed directly.
    location ~ ^/(?!index\.php).*\.php$ {
        deny all;
    }
}
