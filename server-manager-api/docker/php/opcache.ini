; ---------------------------------------------------------------------------
; OPcache — the single largest throughput win for a production Laravel app.
;
; `validate_timestamps=0` means PHP never stats files to check for changes, so
; the container MUST be redeployed (not hot-edited) to pick up new code.
; ---------------------------------------------------------------------------

opcache.enable = 1
opcache.enable_cli = 0

opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

opcache.save_comments = 1
opcache.fast_shutdown = 1

; Preloading gives another boost, but any fatal error during preload takes the
; whole pool down — enable only after verifying it in staging.
; opcache.preload = /var/www/html/vendor/autoload.php
; opcache.preload_user = www-data
