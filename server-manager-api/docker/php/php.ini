; ---------------------------------------------------------------------------
; Application PHP settings (loaded after the base image defaults).
; ---------------------------------------------------------------------------

memory_limit = 512M
max_execution_time = 60

; Uploads: avatars only, so keep these tight.
upload_max_filesize = 8M
post_max_size = 10M
max_file_uploads = 10

; Never advertise the PHP version.
expose_php = Off

; Log to the container's stderr so `docker logs` captures everything.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

date.timezone = UTC

; Sessions are stored in the database (SESSION_DRIVER=database); these apply to
; any residual native session use.
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600
