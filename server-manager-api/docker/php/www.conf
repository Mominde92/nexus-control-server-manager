; ---------------------------------------------------------------------------
; PHP-FPM pool. Tune pm.max_children to (container memory / avg request MB).
; ---------------------------------------------------------------------------
[www]
user = www-data
group = www-data

listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Recycle workers periodically to bound the effect of any slow leak.
pm.max_requests = 500

; Surface worker output in `docker logs`.
catch_workers_output = yes
decorate_workers_output = no

; Log requests slower than 5s with a stack trace — invaluable for finding N+1s.
slowlog = /dev/stderr
request_slowlog_timeout = 5s

; Expose an FPM status page to the local network only (scraped by monitoring).
pm.status_path = /fpm-status
ping.path = /fpm-ping

clear_env = no
