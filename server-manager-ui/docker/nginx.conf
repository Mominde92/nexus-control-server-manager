# ---------------------------------------------------------------------------
# Nginx vhost for the React SPA.
#
# Two things matter here:
#   1. Client-side routing — unknown paths must fall back to index.html, or a
#      refresh on /hostings/12 would 404.
#   2. Cache policy — hashed assets are immutable and cached forever;
#      index.html must never be cached, or users get a stale shell that
#      references deleted asset hashes after a deploy.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # --- Security headers ---------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
    # Enable behind TLS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # --- Static assets: content-hashed, safe to cache indefinitely ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # --- The app shell: never cached ---------------------------------------
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    # --- SPA fallback ------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.html;
}
